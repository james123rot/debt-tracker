<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Debt Tracker</title>
<style>
:root{--bg:#050505;--c1:#0f0f10;--c2:#161617;--bd:#242427;--tx:#f4f4f5;--mut:#8b8b92;--g:#22c55e;--gd:#16a34a;--gs:rgba(34,197,94,.13);--r:#ef4444;--rs:rgba(239,68,68,.13);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.w{max-width:760px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:rgba(5,5,5,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--gd));display:grid;place-items:center;color:#021b0b;font-style:normal;font-weight:800;box-shadow:0 0 18px rgba(34,197,94,.45)}
main{padding:18px 16px 110px}
.hero{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:20px;padding:20px;background:radial-gradient(120% 140% at 0% 0%,rgba(34,197,94,.18),transparent 55%),var(--c1);animation:up .6s both}
.hero .row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.amt{font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.ring{position:relative;width:72px;height:72px;flex:none}.ring svg{width:72px;height:72px;transform:rotate(-90deg);stroke-width:7}
.ring circle{fill:none}.ring .bg{stroke:var(--bd)}.ring .fg{stroke:var(--g);stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px rgba(34,197,94,.6))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini div{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.mini b{display:block;font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin:18px 0 12px}
.search{flex:1;position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:17px}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);width:100%;background:var(--c1);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;outline:none;transition:.2s}
.search input{padding-left:40px}select{width:auto;padding-right:10px}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gs)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.chips::-webkit-scrollbar{display:none}
.chip,.btn,.fab{position:relative;overflow:hidden;font:inherit;cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.chip{background:var(--c1);color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip span{opacity:.6;margin-left:4px}.chip.on{background:var(--g);border-color:var(--g);color:#04210d;font-weight:600;box-shadow:0 0 16px rgba(34,197,94,.35)}
.btn{background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:#3a3a3f}.btn:active,.chip:active,.fab:active{transform:scale(.96)}
.btn.p{background:var(--g);border-color:var(--g);color:#04210d}.btn.p:hover{box-shadow:0 0 20px rgba(34,197,94,.5)}
.btn.rd{background:var(--rs);border-color:rgba(239,68,68,.4);color:var(--r)}.btn.rd.solid{background:var(--r);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px}
.rip{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.28);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(5);opacity:0}}
.item{position:relative;display:block;background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.item:hover{transform:translateY(-2px);border-color:rgba(34,197,94,.55);box-shadow:0 8px 26px rgba(34,197,94,.1);background:var(--c2)}
.item:active{transform:scale(.985)}.item.od{border-left:3px solid var(--r)}
.anim .item{animation:up .5s both;animation-delay:calc(var(--i)*45ms)}
.rt{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--g);background:var(--gs);border:1px solid rgba(34,197,94,.35);flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.sub,.mut{color:var(--mut);font-size:13px}
.rr{text-align:right}.rr b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:3px}
.pill.paid{background:var(--gs);color:var(--g)}.pill.partial{border:1px solid rgba(34,197,94,.5);color:var(--g)}
.pill.overdue{background:var(--rs);color:var(--r)}.pill.overdue:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--r);animation:pl 1.4s infinite}
.pill.unpaid{background:var(--c2);color:var(--mut);border:1px solid var(--bd)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}100%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}
.bar{height:5px;border-radius:9px;background:var(--bd);margin-top:12px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--gd),var(--g));border-radius:9px;transform-origin:left;animation:gr 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.empty{text-align:center;color:var(--mut);padding:50px 16px;animation:up .5s both}.empty svg{font-size:44px;color:var(--g);margin-bottom:8px}
.sk{height:72px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--c1) 25%,var(--c2) 50%,var(--c1) 75%);background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--g);color:#04210d;font-size:26px;box-shadow:0 8px 26px rgba(34,197,94,.5);display:none;place-items:center;z-index:4}
@media(max-width:560px){.fab{display:grid}.top .btn.nw{display:none}}
dialog{position:fixed;left:0;right:0;top:8vh;bottom:auto;margin:0 auto;border:1px solid var(--bd);padding:0;background:var(--c1);color:var(--tx);border-radius:22px;width:min(480px,94vw);max-height:84vh;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 30px 80px rgba(0,0,0,.8)}
dialog[open]{animation:pop .32s cubic-bezier(.2,.9,.3,1.15)}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px);animation:fd .25s}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}}@keyframes fd{from{opacity:0}}
.sheet{padding:20px;position:relative}.sheet h3{margin:0 0 3px;font-size:20px;letter-spacing:-.01em}
.xb{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--c2);color:var(--mut);cursor:pointer;display:grid;place-items:center;font-size:16px}
label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:15px 0 6px;text-transform:uppercase;letter-spacing:.07em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;margin-top:20px}.acts .btn{flex:1}
.hd{display:flex;gap:13px;align-items:center;margin:0 36px 12px 0}.hd .av{width:52px;height:52px;font-size:18px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:14px;font-variant-numeric:tabular-nums}
.info{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}.det{margin-top:8px;display:grid;gap:3px}
.sec{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:22px}
.tx{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd);animation:up .4s both}.tx:last-child{border:0}
.tx .x{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 7px;font-size:15px;transition:.15s}.tx .x:hover{color:var(--r);transform:scale(1.2)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#050505;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.er{background:var(--r);color:#fff}
.ld{position:fixed;top:0;left:0;height:3px;width:0;background:var(--g);box-shadow:0 0 10px var(--g);z-index:70;transition:width .5s}.ld.on{width:85%}
.burst{position:fixed;inset:0;pointer-events:none;z-index:80}.burst i{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--c);animation:bs 1s ease-out forwards}
@keyframes bs{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:16px;cursor:pointer;user-select:none}
.sw input{display:none}.sw .tg{width:44px;height:26px;border-radius:99px;background:var(--bd);position:relative;transition:.25s;flex:none}
.sw .tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+.tg{background:var(--g);box-shadow:0 0 12px rgba(34,197,94,.5)}.sw input:checked+.tg:after{transform:translateX(18px)}
.ib{overflow:hidden;max-height:0;opacity:0;transition:max-height .4s,opacity .3s}.ib.on{max-height:240px;opacity:1}
.hbtn{width:38px;height:38px;border-radius:50%;padding:0;font-size:18px}.mailall{width:100%;margin-top:12px}
.ov{position:absolute;inset:0;z-index:90;background:rgba(10,10,11,.86);backdrop-filter:blur(3px);animation:fd .2s;border-radius:inherit}
.ov.g{position:fixed;background:rgba(0,0,0,.78)}
.ovi{position:sticky;top:0;height:min(100%,70vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.ov.g .ovi{height:100vh;position:fixed;inset:0}
.ovi b{font-size:16px;animation:pl2 1.4s ease-in-out infinite}@keyframes pl2{50%{opacity:.55}}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--g);animation:sp .8s linear infinite!important;box-shadow:0 0 22px rgba(34,197,94,.35)}
@keyframes sp{to{transform:rotate(360deg)}}
.mt{display:inline-block;font-size:11px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--c2);border:1px solid var(--bd);color:var(--tx);margin-left:4px}
.top{padding-top:env(safe-area-inset-top,0px)}
.paper{background:#fff;color:#111;border-radius:12px;padding:18px;font:14px/1.7 Georgia,serif;white-space:pre-wrap;margin-top:12px;max-height:45vh;overflow:auto}
.paidbig{display:inline-flex;align-items:center;gap:10px;background:var(--g);color:#04210d;font-weight:900;font-size:28px;letter-spacing:.02em;padding:12px 24px;border-radius:16px;margin-top:14px;box-shadow:0 0 28px rgba(34,197,94,.45)}
.doc{background:#fff;color:#111;font-family:"Times New Roman",Times,Georgia,serif;padding:26px 22px;border-radius:6px;margin-top:12px;max-height:52vh;overflow:auto;box-shadow:inset 0 0 0 1px #d4d4d8;font-size:14px;line-height:1.6}
.dh{text-align:center}.dl{max-height:56px;max-width:60%;object-fit:contain}.dn{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-top:6px}
.rule{border-top:3px solid #111;border-bottom:1px solid #111;height:5px;margin:12px 0 14px}
.dt{text-align:center;font-size:19px;letter-spacing:.2em;margin:6px 0 2px;font-weight:700}.dref{text-align:center;font-size:11px;color:#555;margin-bottom:16px}
.dc{margin-bottom:12px}.dch{font-weight:700}.dc p{margin:2px 0 0;text-align:justify}
.dsl{display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px}.dsl span{white-space:nowrap}.dsb{flex:1;max-width:260px;border-bottom:1px solid #111;height:52px;display:flex;align-items:flex-end}.dsb img{max-height:50px;max-width:100%;object-fit:contain;object-position:left bottom}
.pgb{border-top:2px dashed #bbb;margin:30px 0 22px}.dc.hd{margin-bottom:2px;margin-top:8px}
.dsig{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}.dsig .sl{border-top:1px solid #111;margin:0 0 4px}.dsig span{font-size:12px;color:#555}.ds{height:56px;max-width:100%;object-fit:contain;object-position:left bottom;display:block}
a.btn{color:var(--g)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="ld" id="ld"></div>
<div class="top"><div class="w"><div class="logo"><i>₱</i>Debt Tracker</div><div style="display:flex;gap:8px;align-items:center"><button class="btn sm" id="inst" style="display:none" onclick="doInstall()">Install app</button><button class="btn hbtn" onclick="openSettings()" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="btn p sm nw" onclick="openNew()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New borrower</button></div></div></div>
<main class="w">
<div class="hero"><div class="row1"><div><div class="lbl">Outstanding balance</div><div class="amt" id="s3">₱0.00</div><div class="sub" id="s4">&nbsp;</div></div>
<div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="rg" cx="32" cy="32" r="26"/></svg><b id="rt">0%</b></div></div>
<div class="mini"><div><span class="lbl">Total lent</span><b id="s1">₱0.00</b></div><div><span class="lbl">Collected</span><b id="s2" style="color:var(--g)">₱0.00</b></div></div>
<button class="btn p mailall" onclick="confirmAll()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span id="mc">Email reminders</span></button></div>

<select id="so" onchange="render(1)"><option value="bal">Highest balance</option><option value="name">Name A–Z</option><option value="due">Due soonest</option></select></div>

<dialog id="dlg"></dialog><div class="toast" id="toast"></div>
<script>
let D=[],filt='all',pending=null,NB=null,CUR='',AGR=null,RC='',INK=false,LOGO,LSIG,SET={name:'',pay:'',agreement:''};
const $=id=>document.getElementById(id);
const P=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sum=a=>a.reduce((s,x)=>s+x.amt,0);
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtD=s=>{if(!s)return'';const a=s.split('-');return MO[+a[1]-1]+' '+(+a[2])+', '+a[0]};
const tot=p=>p.activeDebt+(p.interest||0);
const bal=p=>p.balance;
const LBP={once:'one-time',week:'per week',month:'per month',year:'per year'};
const st=p=>bal(p)<=0.005?'paid':(p.due&&p.due<today()?'overdue':(sum(p.payments)>0?'partial':'unpaid'));
const LB={paid:'Paid',overdue:'Overdue',partial:'Partial',unpaid:'Unpaid'};
const get=id=>D.find(p=>p.id===id);
const days=p=>Math.round((new Date(p.due+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const dueTx=p=>{if(!p.due||bal(p)<=0)return'';const d=days(p);return d<0?Math.abs(d)+'d overdue':d===0?'Due today':'Due in '+d+'d'};
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=n=>`<div class="av">${E(ini(n))}</div>`;
const IC={x:'<path d="M18 6L6 18M6 6l12 12"/>',ph:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',ms:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',bk:'<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h5"/>'};
const I=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function toast(m,er){const t=$('toast');t.textContent=m;t.className='toast on'+(er?' er':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2600)}
function fit(){const v=window.visualViewport,d=$('dlg');if(!v)return;const top=v.height<520?8:Math.min(56,v.height*.07);d.style.top=(v.offsetTop+top)+'px';d.style.maxHeight=(v.height-top-12)+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
function show(h){$('dlg').innerHTML='<div class="sheet"><button class="xb" onclick="closeDlg()" aria-label="Close">'+I('x')+'</button>'+h+'</div>';if(!$('dlg').open)$('dlg').showModal();fit();$('dlg').scrollTop=0}
const closeDlg=()=>$('dlg').close();

const CFGK='dt_cfg',CACHE='dt_cache';

async function api(fn,args){
  const c=cfg();if(!c||!c.url||!c.key)throw new Error('NOCFG');
  let r;try{r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,fn,args:args||[]})})}
  catch(e){throw new Error('No connection. Check your internet and try again.')}
  let j;try{j=await r.json()}catch(e){throw new Error('Unexpected reply. Check the Web App URL and that access is set to Anyone.')}
  if(!j.ok)throw new Error(j.error||'Unknown error');return j.result;
}
function fail(e){
  if(e.message==='NOCFG')return openConnect();
  if(e.message==='Unauthorized')return openConnect('Wrong passcode. Please check it and try again.');

}
function call(fn,args,msg,after){
  $('ld').className='ld on';const b=BL[fn];if(b)busy(1,b[0],b[1]);
  api(fn,args).then(d=>{
    $('ld').className='ld';busy(0);const x=Array.isArray(d)?{data:d}:d;D=x.data;
    try{localStorage.setItem(CACHE,JSON.stringify(D))}catch(e){}
    render(fn==='getData');
    if(x.info&&x.info.failed&&x.info.err)return showFail(x.info);
    const m=typeof msg==='function'?msg(x.info):msg;m&&toast(m);after&&after();
  }).catch(e=>{
    $('ld').className='ld';busy(0);fail(e);
    if(!D.length&&e.message!=='NOCFG'&&e.message!=='Unauthorized')$('list').innerHTML='<div class="empty">'+I('x')+'<br>Could not load data.<br><br><button class="btn p" onclick="load()">Try again</button></div>';
  });
}

function readLogo(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let m=300;
  for(let i=0;i<6;i++){const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);
   let u=c.toDataURL('image/png');if(u.length<=44000)return res(u);
   g.globalCompositeOperation='destination-over';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.82);if(u.length<=44000)return res(u);m=Math.round(m*.75)}
  rej(new Error('That logo is too detailed. Try a simpler image.'))};im.onerror=()=>rej(new Error('Could not read that image.'));im.src=fr.result};fr.onerror=()=>rej(new Error('Could not read that file.'));fr.readAsDataURL(file)})}
function pickLogo(inp){const f=inp.files[0];if(f)readLogo(f).then(u=>{LOGO=u;$('lgp').src=u;$('lgp').style.display='block'}).catch(e=>toast(e.message,1))}
function clearLogo(){LOGO='';$('lgp').style.display='none';$('lgf').value=''}
function lsRender(v){$('lsw').innerHTML=(v?`<img src="${v}" style="background:#fff;border-radius:10px;height:70px;max-width:100%;display:block" alt="Signature">`:'<div class="sub">No signature saved yet.</div>')+`<div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" onclick="lsEdit()">${v?'Change signature':'Draw signature'}</button>${v?'<button class="btn sm rd" onclick="lsClear()">Remove</button>':''}</div>${LSIG!==undefined?'<div class="sub" style="margin-top:6px">Press Save to apply it to all agreements.</div>':''}`}
function lsEdit(){$('lsw').innerHTML=sigPad()+'<div class="acts" style="margin-top:8px"><button class="btn" onclick="lsRender(LSIG!==undefined?LSIG:SET.lsig)">Cancel</button><button class="btn p" onclick="lsUse()">Use signature</button></div>';sigInit()}
function lsUse(){const d=sigData();if(!d)return toast('Please draw your signature first.',1);LSIG=d;lsRender(d)}
function lsClear(){LSIG='';lsRender('')}
function ask(title,text,back,fn){
  pending=fn;
  show(`<h3>${title}</h3><div class="mut" style="margin-top:6px">${text}</div>
  <div class="acts"><button class="btn" onclick="${back}">Cancel</button><button class="btn rd solid" onclick="pending()">Delete</button></div>`);
}
function askTx(id,tid){ask('Delete this entry?','This will change the balance. It cannot be undone.',`openDetail('${id}')`,()=>call('deleteTx',[tid],'Entry deleted',()=>openDetail(id)))}
function askP(id){ask('Delete this borrower?','The record and all their transactions will be permanently removed.',`openDetail('${id}')`,()=>call('deleteBorrower',[id],'Borrower deleted',closeDlg))}
try{D=JSON.parse(localStorage.getItem(CACHE)||'[]')}catch(e){D=[]}
D=D.filter(p=>p&&p.balance!==undefined);
if(D.length)render(1);
if(cfg()){load();loadSet()}else openConnect();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
